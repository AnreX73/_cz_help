[package]
name = "cz-help"
version = "0.1.0"
description = "Помощник самозанятого"
authors = ["cz_help"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "cz_help_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
printpdf = { version = "0.12", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rqrr = "0.11"
qrcode = "0.14"
sha2 = "0.10"
base64 = "0.22"
ttf-parser = "0.25"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
